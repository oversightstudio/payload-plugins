name: Package check

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ inputs.package }}" typecheck
      - run: pnpm --filter "${{ inputs.package }}" test
      - run: pnpm --filter "${{ inputs.package }}" build
      - run: node scripts/verify-package.mjs "${{ inputs.package }}"
